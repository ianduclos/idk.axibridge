<div id="ribbon-study">
  <div class="viz-controls">
    <label class="form-label">Path
      <select class="form-select" id="ribbon-shape">
        <option value="straight" selected>A · Straight</option>
        <option value="arch">B · Arch</option>
        <option value="sCurve">B · S-curve</option>
        <option value="corner">C · Corner</option>
        <option value="loop">Loop</option>
        <option value="hairpin">Tight bend</option>
        <option value="many">Different lengths</option>
      </select>
    </label>
    <label class="form-label">Output
      <select class="form-select" id="ribbon-outputMode">
        <option value="strands">Strands</option>
        <option value="outline">Outline only</option>
        <option value="solid">Solid silhouette</option>
      </select>
    </label>
    <label class="form-label">Crest rhythm
      <select class="form-select" id="ribbon-rhythm">
        <option value="phrased" selected>Phrased</option>
        <option value="legacy">Original randomness</option>
      </select>
    </label>
    <label class="form-label">Width <output id="ribbon-width-value">24</output>
      <input class="form-range" id="ribbon-width" type="range" min="5" max="90" value="24" step="1">
    </label>
    <label class="form-label"><span id="ribbon-wave-label">Wavelength</span> <output id="ribbon-wavelength-value">120</output>
      <input class="form-range" id="ribbon-wavelength" type="range" min="45" max="240" value="120" step="5">
    </label>
    <label class="form-label" id="ribbon-right-wave-control" hidden>Right wavelength <output id="ribbon-wavelengthRight-value">180</output>
      <input class="form-range" id="ribbon-wavelengthRight" type="range" min="45" max="240" value="180" step="5">
    </label>
    <label class="form-label" id="ribbon-legacy-controls" hidden>Variation <output id="ribbon-variation-value">75%</output>
      <input class="form-range" id="ribbon-variation" type="range" min="0" max="100" value="75" step="5">
    </label>
    <label class="form-label" data-phrase-control>Spacing variation <output id="ribbon-spacingVariation-value">75%</output>
      <input class="form-range" id="ribbon-spacingVariation" type="range" min="0" max="100" value="75" step="5">
    </label>
    <label class="form-label" data-phrase-control>Height variation <output id="ribbon-heightVariation-value">75%</output>
      <input class="form-range" id="ribbon-heightVariation" type="range" min="0" max="100" value="75" step="5">
    </label>
    <label class="form-label" data-phrase-control>Phrase strength <output id="ribbon-phrasing-value">70%</output>
      <input class="form-range" id="ribbon-phrasing" type="range" min="0" max="100" value="70" step="5">
    </label>
    <label class="form-label">Strands per side <output id="ribbon-steps-value">10</output>
      <input class="form-range" id="ribbon-steps" type="range" min="1" max="32" value="10" step="1">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label">Seed A <input class="form-control" id="ribbon-seedA" type="number" min="0" max="4294967295" step="1" value="7"></label>
    <label class="form-label">Seed B <input class="form-control" id="ribbon-seedB" type="number" min="0" max="4294967295" step="1" value="19"></label>
    <label class="form-label">Blend A → B <output id="ribbon-seedBlend-value">0%</output>
      <input class="form-range" id="ribbon-seedBlend" type="range" min="0" max="100" value="0" step="1">
    </label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" id="ribbon-independentWavelengths" type="checkbox"><span class="form-check-label">Independent wavelengths</span></label>
    <button class="btn" id="ribbon-next" type="button">New A</button>
    <button class="btn" id="ribbon-nextB" type="button">New B</button>
    <label class="form-check"><input class="form-check-input" id="ribbon-mask" type="checkbox"><span class="form-check-label">Mask loops</span></label>
    <label class="form-check"><input class="form-check-input" id="ribbon-reverse" type="checkbox" disabled><span class="form-check-label">Reverse order</span></label>
    <label class="form-check"><input class="form-check-input" id="ribbon-guide" type="checkbox"><span class="form-check-label">Highlight original</span></label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" id="ribbon-mergeOverlaps" type="checkbox" checked><span class="form-check-label">Merge outline overlaps</span></label>
    <label class="form-check"><input class="form-check-input" id="ribbon-solidOccluder" type="checkbox"><span class="form-check-label">Solid occluder</span></label>
    <label class="form-check"><input class="form-check-input" id="ribbon-background" type="checkbox"><span class="form-check-label">Show lower layer</span></label>
    <label class="form-check"><input class="form-check-input" id="ribbon-widthByLength" type="checkbox"><span class="form-check-label">Trim width by path length</span></label>
  </div>
  <div id="ribbon-drawings" aria-live="off"></div>
  <div class="text-small text-muted" id="ribbon-detail" role="status"></div>
</div>
<style>
  #ribbon-study [hidden] {display:none !important;}
  #ribbon-study {font-family: ui-monospace, SFMono-Regular, Menlo, monospace;}
  #ribbon-study .ribbon-label {margin: 14px 0 5px; font-size: 13px;}
  #ribbon-study .ribbon-drawing {display:block; width:100%; background:#FFFCF0;}
  #ribbon-study .ribbon-ink {fill:none; stroke:#100F0F; stroke-width:.65; stroke-linejoin:round; stroke-linecap:round;}
  #ribbon-study .ribbon-guide {fill:none; stroke:#AF3029; stroke-width:1.25; stroke-dasharray:5 4;}
  #ribbon-study #ribbon-detail {margin-top:10px;}
</style>

<script>
(() => {
  const root = document.getElementById('ribbon-study');
  const find = id => root.querySelector('#ribbon-' + id);
  const relations = [['mirrored','1 · Mirrored'],['related','2 · Related, unequal'],['independent','3 · Independent']];

  const pathData = points => points.map((p,i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(3)).join(' ')).join(' ');
  function draw() {
    const seed=(+find('seedA').value||0)>>>0;
    const options = { seed, seedB:(+find('seedB').value||0)>>>0, seedBlend:+find('seedBlend').value/100,
      independentWavelengths:find('independentWavelengths').checked,wavelengthRight:+find('wavelengthRight').value, rhythm:find('rhythm').value,
      spacingVariation:+find('spacingVariation').value/100, heightVariation:+find('heightVariation').value/100,
      phrasing:+find('phrasing').value/100, width: +find('width').value, wavelength: +find('wavelength').value,
      variation: +find('variation').value / 100, steps: +find('steps').value,
      outputMode:find('outputMode').value,mergeOverlaps:find('mergeOverlaps').checked,solidOccluder:find('solidOccluder').checked,
      widthByLength:find('widthByLength').checked,taper:.12,maskLoops:find('outputMode').value==='strands'&&find('mask').checked,reverseOrder:find('reverse').checked };
    find('mergeOverlaps').disabled=options.outputMode!=='outline';
    find('mask').disabled=options.outputMode!=='strands';
    find('guide').disabled=options.outputMode!=='strands';
    find('widthByLength').disabled=find('shape').value!=='many';
    find('right-wave-control').hidden=!options.independentWavelengths;
    find('wave-label').textContent=options.independentWavelengths?'Left wavelength':'Wavelength';
    find('wavelengthRight-value').textContent=options.wavelengthRight;
    find('seedBlend-value').textContent=Math.round(options.seedBlend*100)+'%';
    find('legacy-controls').hidden=options.rhythm!=='legacy';
    root.querySelectorAll('[data-phrase-control]').forEach(el=>el.hidden=options.rhythm==='legacy');
    for(const key of ['spacingVariation','heightVariation','phrasing']) find(key+'-value').textContent=Math.round(options[key]*100)+'%';
    find('reverse').disabled=!options.maskLoops;
    for (const key of ['width','wavelength','steps']) find(key+'-value').textContent = options[key];
    find('variation-value').textContent = Math.round(options.variation*100)+'%';
    const fixtures = typeof RibbonStudy.fixtures === 'function' ? RibbonStudy.fixtures() : RibbonStudy.fixtures;
    const inputs = find('shape').value==='many' ? [
      [[40,45],[660,45]],[[40,115],[480,115]],[[40,185],[300,185]],[[40,255],[150,255]]
    ] : [fixtures[find('shape').value]];
    const results = relations.map(([relation,label]) => ({label:relation==='mirrored'&&options.independentWavelengths&&options.wavelengthRight!==options.wavelength?'1 · Same pattern, unequal wavelengths':label, ...RibbonStudy.generateMany(inputs,{...options,relation})}));
    // The same framing for every relation preserves the comparison's scale.
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for (const r of results) for (const strand of r.strands) for(const [x,y] of strand) {
      x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);
    }
    const pad=16, box=[x0-pad,y0-pad,x1-x0+2*pad,Math.max(110,y1-y0+2*pad)];
    const background=Array.from({length:28},(_,i)=>{
      const x=box[0]+i*box[2]/27;return [[x,box[1]],[x-35,box[1]+box[3]]];
    });
    for(const r of results)r.background=find('background').checked ?
      (options.solidOccluder||options.outputMode==='solid' ? RibbonSilhouette.clipPaths(background,r.silhouette??[]) : background) : [];
    find('drawings').innerHTML = results.map(r => `<div class="ribbon-label">${r.label}</div><svg class="ribbon-drawing" role="img" aria-label="${r.label} open path ribbon, ${options.outputMode}" viewBox="${box.join(' ')}"><title>${r.label}</title><g class="ribbon-lower" fill="none" stroke="#878580" stroke-width=".8">${r.background.map(p=>`<path d="${pathData(p)}"/>`).join('')}</g>${options.outputMode==='solid' ? `<path class="ribbon-solid" fill="#100F0F" fill-rule="evenodd" d="${(r.silhouette??[]).flat().map(p=>pathData(p)+'Z').join(' ')}"/>` : `<g class="ribbon-ink">${r.drawingPaths.map(p=>`<path d="${pathData(p)}"/>`).join('')}</g>`}${options.outputMode==='solid'?`<g class="ribbon-ink">${r.items.filter(item=>item.diagnostics.skipped).flatMap(item=>item.strands).map(p=>`<path d="${pathData(p)}"/>`).join('')}</g>`:''}${find('guide').checked&&options.outputMode==='strands' ? r.spines.map(p=>`<path class="ribbon-guide" d="${pathData(p)}"/>`).join('') : ''}</svg>`).join('');
    find('detail').textContent = `${options.outputMode==='strands' ? (find('shape').value==='many' ? results[0].retainedSteps.map(n=>2*n+1).join(' / ')+' strands' : (2*options.steps+1)+' strands') : options.outputMode==='outline'?'Outline only':'Solid silhouette'} · ${options.solidOccluder||options.outputMode==='solid'?'Solid occlusion':options.maskLoops ? (options.reverseOrder ? 'Earlier passages on top' : 'Later passages on top') : 'Transparent crossings'} · Study units`;
    root.dataset.rendered = 'true';
    root.dataset.seed = String(seed);
  }
  root.querySelectorAll('input,select').forEach(el => el.addEventListener('input',draw));
  find('next').addEventListener('click',() => {find('seedA').value=((+find('seedA').value||0)+1)>>>0;draw();});
  find('nextB').addEventListener('click',() => {find('seedB').value=((+find('seedB').value||0)+1)>>>0;draw();});
  draw();
})();
</script>
