<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Concept A — clearly scoped composition inspector</title><desc id="desc">A large complete sheet sits beside a layer inspector. Number one identifies the selected editing target. Number two opens a temporary creation browser.</desc><g font-family="system-ui, -apple-system, sans-serif"><rect x="0" y="0" width="1200" height="740" rx="0" fill="#100F0F"/><text x="32" y="35" font-size="13" fill="#4385BE" font-weight="600">CONCEPT A  /  F09 · F10 · F15</text><text x="32" y="72" font-size="28" fill="#CECDC3" font-weight="650">Make the editing target unmistakable</text><rect x="30" y="100" width="1140" height="525" rx="3" fill="#1C1B1A" stroke="#403E3C"/><rect x="30" y="100" width="1140" height="43" rx="3" fill="#282726"/><text x="47" y="127" font-size="16" fill="#CECDC3" font-weight="400">Study 07 · Edited</text><text x="745" y="127" font-size="16" fill="#CECDC3" font-weight="400">Compose     Develop     Output</text><text x="49" y="178" font-size="15" fill="#CECDC3" font-weight="400">Select   Draw   Pen   Brush   Shape</text><rect x="47" y="196" width="755" height="407" rx="3" fill="#100F0F"/><rect x="207" y="212" width="405" height="375" rx="3" fill="#FFFCF0"/><text x="339" y="385" font-size="19" fill="#6F6E69" font-weight="400">Your drawing</text><text x="299" y="411" font-size="14" fill="#6F6E69" font-weight="400">same geometry · full sheet</text><path d="M818 145 L818 625" fill="none" stroke="#403E3C" stroke-width="1.5"/><rect x="837" y="159" width="26" height="26" rx="3" fill="#4385BE"/><text x="845" y="178" font-size="15" fill="#100F0F" font-weight="700">1</text><text x="873" y="177" font-size="18" fill="#CECDC3" font-weight="650">Editing layer · Flow field</text><text x="840" y="213" font-size="15" fill="#B7B5AC" font-weight="400">Source    Placement    Effects</text><path d="M840 231 L1148 231" fill="none" stroke="#403E3C" stroke-width="1.5"/><text x="840" y="266" font-size="15" fill="#CECDC3" font-weight="400">Line separation</text><path d="M840 287 L1080 287" fill="none" stroke="#575653" stroke-width="1.5"/><rect x="958" y="279" width="9" height="16" rx="3" fill="#4385BE"/><text x="1100" y="291" font-size="14" fill="#CECDC3" font-weight="400">2.5</text><text x="840" y="327" font-size="15" fill="#CECDC3" font-weight="400">Wavelength</text><path d="M840 348 L1080 348" fill="none" stroke="#575653" stroke-width="1.5"/><rect x="971" y="340" width="9" height="16" rx="3" fill="#4385BE"/><text x="1100" y="352" font-size="14" fill="#CECDC3" font-weight="400">60</text><text x="840" y="388" font-size="15" fill="#CECDC3" font-weight="400">Swirl</text><path d="M840 409 L1080 409" fill="none" stroke="#575653" stroke-width="1.5"/><rect x="984" y="401" width="9" height="16" rx="3" fill="#4385BE"/><text x="1100" y="413" font-size="14" fill="#CECDC3" font-weight="400">1.0</text><text x="840" y="443" font-size="14" fill="#B7B5AC" font-weight="400">Advanced parameters  ›</text><path d="M840 462 L1148 462" fill="none" stroke="#403E3C" stroke-width="1.5"/><text x="840" y="490" font-size="16" fill="#CECDC3" font-weight="650">Layers</text><rect x="834" y="508" width="317" height="33" rx="3" fill="#282726"/><text x="848" y="530" font-size="14" fill="#CECDC3" font-weight="400">◉  Flow field    · black pen</text><text x="848" y="569" font-size="14" fill="#CECDC3" font-weight="400">◉  Second Reading</text><text x="49" y="652" font-size="17" fill="#CECDC3" font-weight="400">1  Context belongs above the controls it governs.</text><text x="49" y="683" font-size="17" fill="#CECDC3" font-weight="400">2  New element opens a temporary browser; it does not obscure selection scope.</text><rect x="606" y="155" width="26" height="26" rx="3" fill="#4385BE"/><text x="614" y="174" font-size="15" fill="#100F0F" font-weight="700">2</text><rect x="644" y="154" width="157" height="32" rx="3" fill="#282726" stroke="#403E3C"/><text x="658" y="176" font-size="15" fill="#CECDC3" font-weight="400">+ New element</text><text x="49" y="716" font-size="12" fill="#878580" font-weight="400">SCHEMATIC PROPOSAL · empty paper is intentional; no artistic comparison is implied.</text></g></svg>