<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Concept B — development workspace</title><desc id="desc">A full drawing stage is accompanied by an optional pinned reference. Turn actions sit directly below the stage and a changed parameter shows current and next-turn values.</desc><g font-family="system-ui, -apple-system, sans-serif"><rect x="0" y="0" width="1200" height="740" rx="0" fill="#100F0F"/><text x="32" y="35" font-size="13" fill="#4385BE" font-weight="600">CONCEPT B  /  F11 · F12 · F13</text><text x="32" y="72" font-size="28" fill="#CECDC3" font-weight="650">Give development a full working surface</text><rect x="30" y="100" width="1140" height="535" rx="3" fill="#1C1B1A" stroke="#403E3C"/><rect x="30" y="100" width="1140" height="45" rx="3" fill="#282726"/><text x="48" y="128" font-size="17" fill="#CECDC3" font-weight="400">← Composition   /   Second Reading</text><text x="792" y="128" font-size="16" fill="#CECDC3" font-weight="400">Alternative 2 · Working draft</text><rect x="47" y="160" width="817" height="357" rx="3" fill="#100F0F"/><rect x="210" y="170" width="490" height="337" rx="3" fill="#FFFCF0"/><text x="385" y="330" font-size="19" fill="#6F6E69" font-weight="400">Active drawing</text><text x="323" y="357" font-size="15" fill="#6F6E69" font-weight="400">Fit uses the space actually available</text><rect x="65" y="173" width="26" height="26" rx="3" fill="#4385BE"/><text x="73" y="192" font-size="15" fill="#100F0F" font-weight="700">1</text><rect x="882" y="160" width="270" height="357" rx="3" fill="#282726"/><text x="899" y="188" font-size="16" fill="#CECDC3" font-weight="400">Pinned reference</text><rect x="929" y="207" width="178" height="142" rx="3" fill="#FFFCF0"/><text x="966" y="282" font-size="14" fill="#6F6E69" font-weight="400">Alternative 1</text><text x="899" y="382" font-size="13" fill="#CECDC3" font-weight="400">Preview: independently fitted</text><text x="899" y="414" font-size="13" fill="#CECDC3" font-weight="400">Turn 15 · before human turn</text><text x="899" y="450" font-size="13" fill="#CECDC3" font-weight="400">Compare at shared scale →</text><rect x="1111" y="170" width="26" height="26" rx="3" fill="#4385BE"/><text x="1119" y="189" font-size="15" fill="#100F0F" font-weight="700">2</text><text x="49" y="551" font-size="17" fill="#CECDC3" font-weight="400">Turn 18    ─────●──────────────</text><text x="455" y="551" font-size="15" fill="#D0A215" font-weight="400">Attention  0.50 → 0.80 next turn</text><rect x="49" y="575" width="142" height="35" rx="3" fill="#205EA6"/><text x="63" y="598" font-size="16" fill="#CECDC3" font-weight="400">Continue</text><rect x="202" y="575" width="119" height="35" rx="3" fill="#282726" stroke="#403E3C"/><text x="215" y="598" font-size="16" fill="#CECDC3" font-weight="400">Your turn</text><rect x="332" y="575" width="130" height="35" rx="3" fill="#282726" stroke="#403E3C"/><text x="344" y="598" font-size="16" fill="#CECDC3" font-weight="400">Try another</text><rect x="1010" y="575" width="140" height="35" rx="3" fill="#282726" stroke="#403E3C"/><text x="1022" y="598" font-size="16" fill="#CECDC3" font-weight="400">Keep as layer</text><text x="49" y="669" font-size="17" fill="#CECDC3" font-weight="400">1  One complete sheet and a compact action row anchor the workspace.</text><text x="49" y="700" font-size="17" fill="#CECDC3" font-weight="400">2  Comparison is optional; new-drawing setup and process details can fold away.</text><text x="49" y="726" font-size="12" fill="#878580" font-weight="400">SCHEMATIC PROPOSAL · this is a spatial trial, not an approved new navigation system.</text></g></svg>