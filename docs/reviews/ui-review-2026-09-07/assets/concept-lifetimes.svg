<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Concept C — work has distinct lifetimes</title><desc id="desc">Working recipe becomes a kept layer. Save and Stage branch from the current project as separate actions. Plotting is a further physical commitment.</desc><g font-family="system-ui, -apple-system, sans-serif"><rect x="0" y="0" width="1200" height="740" rx="0" fill="#100F0F"/><text x="32" y="35" font-size="13" fill="#4385BE" font-weight="600">CONCEPT C  /  F02 · F14 · A01</text><text x="32" y="72" font-size="28" fill="#CECDC3" font-weight="650">Make each kind of commitment visible</text><rect x="45" y="210" width="250" height="190" rx="3" fill="#1C1B1A" stroke="#403E3C"/><rect x="45" y="210" width="250" height="4" rx="0" fill="#4385BE"/><text x="61" y="250" font-size="20" fill="#CECDC3" font-weight="650">Working recipe</text><text x="61" y="286" font-size="14" fill="#CECDC3" font-weight="400">Alternative + events</text><text x="61" y="375" font-size="16" fill="#4385BE" font-weight="400">Recovery draft</text><rect x="420" y="210" width="250" height="190" rx="3" fill="#1C1B1A" stroke="#403E3C"/><rect x="420" y="210" width="250" height="4" rx="0" fill="#3AA99F"/><text x="436" y="250" font-size="20" fill="#CECDC3" font-weight="650">Kept layer</text><text x="436" y="286" font-size="14" fill="#CECDC3" font-weight="400">Editable composition</text><text x="436" y="375" font-size="16" fill="#3AA99F" font-weight="400">Project edited</text><rect x="865" y="150" width="285" height="145" rx="3" fill="#1C1B1A" stroke="#403E3C"/><rect x="865" y="150" width="285" height="4" rx="0" fill="#879A39"/><text x="881" y="190" font-size="20" fill="#CECDC3" font-weight="650">Saved project</text><text x="881" y="226" font-size="14" fill="#CECDC3" font-weight="400">Explicit durable edition</text><text x="881" y="270" font-size="16" fill="#879A39" font-weight="400">Saved</text><rect x="865" y="335" width="285" height="145" rx="3" fill="#1C1B1A" stroke="#403E3C"/><rect x="865" y="335" width="285" height="4" rx="0" fill="#D0A215"/><text x="881" y="375" font-size="20" fill="#CECDC3" font-weight="650">Frozen tray</text><text x="881" y="411" font-size="14" fill="#CECDC3" font-weight="400">Output snapshot</text><text x="881" y="455" font-size="16" fill="#D0A215" font-weight="400">Ready to plot</text><path d="M305 305 L410 305" fill="none" stroke="#878580" stroke-width="1.5"/><text x="330" y="289" font-size="14" fill="#B7B5AC" font-weight="400">Keep</text><path d="M680 305 L755 305" fill="none" stroke="#878580" stroke-width="1.5"/><path d="M755 221 L755 405" fill="none" stroke="#878580" stroke-width="1.5"/><path d="M755 221 L855 221" fill="none" stroke="#878580" stroke-width="1.5"/><path d="M755 405 L855 405" fill="none" stroke="#878580" stroke-width="1.5"/><text x="783" y="205" font-size="14" fill="#B7B5AC" font-weight="400">Save</text><text x="783" y="389" font-size="14" fill="#B7B5AC" font-weight="400">Stage</text><path d="M45 515 L1150 515" fill="none" stroke="#403E3C" stroke-width="1.5"/><text x="45" y="550" font-size="20" fill="#4385BE" font-weight="700">1</text><text x="78" y="550" font-size="19" fill="#CECDC3" font-weight="400">Recovery protects exploration without overwriting a named save.</text><text x="45" y="591" font-size="20" fill="#3AA99F" font-weight="700">2</text><text x="78" y="591" font-size="19" fill="#CECDC3" font-weight="400">Keep adds a recipe to the project; Save and Stage are distinct actions.</text><text x="45" y="632" font-size="20" fill="#D0A215" font-weight="700">3</text><text x="78" y="632" font-size="19" fill="#CECDC3" font-weight="400">A frozen tray does not silently change when its live source is edited.</text><text x="45" y="680" font-size="16" fill="#B7B5AC" font-weight="400">Plotting adds a separate physical commitment. A saved project can include its existing trays.</text><text x="45" y="719" font-size="12" fill="#878580" font-weight="400">SCHEMATIC PROPOSAL · state language for the UI; not a new storage contract.</text></g></svg>