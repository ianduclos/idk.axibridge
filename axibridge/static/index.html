<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>axibridge</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- pywebview-drag-region: with DRAG_REGION_DIRECT_TARGET_ONLY only the bar's
     own empty space drags the window, so the controls inside stay clickable.
     Inert in a browser tab. -->
<header class="pywebview-drag-region">
  <nav class="menubar" id="menubar">
    <div class="menu" data-menu="file">
      <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">File</button>
      <div class="menu-panel" role="menu">
        <button id="btn-save" class="menu-item" title="Save project folder">Save</button>
        <a id="btn-svg" class="menu-item" href="/api/doc/all/svg" download title="Download the resolved geometry (what the pen draws) as SVG">Download SVG</a>
      </div>
    </div>
    <div class="menu" data-menu="edit">
      <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Edit</button>
      <div class="menu-panel" role="menu">
        <button id="btn-undo" class="menu-item" type="button" title="Step back one edit"><span class="menu-check"></span>Undo<span class="menu-key">⌘Z</span></button>
        <button id="btn-redo" class="menu-item" type="button" title="Step forward again — cleared by the next edit"><span class="menu-check"></span>Redo<span class="menu-key">⇧⌘Z</span></button>
      </div>
    </div>
    <div class="menu" data-menu="view">
      <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">View</button>
      <!-- Everything in here IS the control, not a proxy for one: each group
           moved wholesale out of the canvas toolbar, keeping its id and its
           DOM node, so main.js's existing handlers and state sync bind to the
           same elements and nothing was re-implemented. The checkboxes are
           still real <input type="checkbox"> for the same reason — only their
           presentation became a menu tick (style.css, `:has(:checked)`). -->
      <div class="menu-panel" role="menu">
        <div class="menu-group" id="view-toggle">
          <button class="menu-item" type="button" data-view="portrait" title="Display rotation only — geometry never changes"><span class="menu-check">✓</span>Portrait</button>
          <button class="menu-item" type="button" data-view="landscape" title="Display rotation only — geometry never changes"><span class="menu-check">✓</span>Landscape</button>
        </div>
        <div class="menu-sep"></div>
        <div class="menu-group" id="mode-toggle">
          <button class="menu-item on" type="button" data-mode="schematic" title="Uniform hairlines — read the structure, not the ink"><span class="menu-check">✓</span>Schematic</button>
          <button class="menu-item" type="button" data-mode="ink" title="True stroke widths and transparency"><span class="menu-check">✓</span>Ink</button>
        </div>
        <div class="menu-sep"></div>
        <label class="menu-item" title="Show the pen-up moves between paths"><span class="menu-check">✓</span><input type="checkbox" id="show-travel">Travel moves</label>
        <label class="menu-item" title="Number the paths in the order the pen draws them"><span class="menu-check">✓</span><input type="checkbox" id="show-order">Draw order</label>
        <label class="menu-item" title="Dashed outline of the usable sheet area"><span class="menu-check">✓</span><input type="checkbox" id="show-guide" checked>Paper guide</label>
      </div>
    </div>
    <!-- Machine: the ACTIONS out of the jog & pen panel, which now lives in
         Settings. Actions only, per the menu rule — motion parameters and raw
         EBB are forms, soft limits belongs beside the millimetres it guards,
         and holder calibration is a procedure. Each item addresses the very
         button in that panel, so the menu cannot mean something different
         from the panel. Jog is here on Ian's ruling (2026-08-07): keep it,
         use it as a menu item, then decide whether it earns its place. -->
    <div class="menu" data-menu="machine">
      <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Machine</button>
      <div class="menu-panel" role="menu">
        <button class="menu-item" data-target="#btn-pen-up" type="button" title="Raise the pen">Pen up</button>
        <button class="menu-item" data-target="#btn-pen-down" type="button" title="Lower the pen">Pen down</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-target="#btn-goto-origin" type="button" title="Return the carriage to 0,0">Go to origin</button>
        <button class="menu-item" data-target="#btn-set-origin" type="button" title="Declare the current position 0,0">Set origin</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-target="#jog-up" type="button" title="Jog by the step size set in Settings › Jog &amp; pen">Jog up</button>
        <button class="menu-item" data-target="#jog-down" type="button" title="Jog by the step size set in Settings › Jog &amp; pen">Jog down</button>
        <button class="menu-item" data-target="#jog-left" type="button" title="Jog by the step size set in Settings › Jog &amp; pen">Jog left</button>
        <button class="menu-item" data-target="#jog-right" type="button" title="Jog by the step size set in Settings › Jog &amp; pen">Jog right</button>
      </div>
    </div>
  </nav>
  <input id="project-name" class="project-name" value="untitled" spellcheck="false">
  <div id="status-pill" class="pill">connecting…</div>
  <div id="estimate" class="estimate"></div>
</header>

<main>
  <!-- persistent centre canvas -->
  <section id="canvas-area">
    <div id="canvas-toolbar">
      <button id="zoom-fit" title="Fit page">⛶</button>
      <!-- tool icons: Lucide (ISC) — see THIRD-PARTY-NOTICES.md. Stroke style
           and stroke-width come from .tool-icon in style.css, in one place. -->
      <div class="seg" id="tool-toggle">
        <button data-tool="select" class="on" title="Select and transform layers"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg> Select</button>
        <button data-tool="draw" title="Draw on the sheet — strokes become a Drawing layer"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> Draw</button>
        <button data-tool="pen" title="Anchor/handle pen — click for a corner, drag for a smooth curve"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></svg> Pen</button>
        <button data-tool="brush" title="Circle brush — paint a filled mass; [ and ] resize, E toggles erase"><svg class="tool-icon" viewBox="0 0 24 24"><path d="m11 10 3 3"/><path d="M6.5 21A3.5 3.5 0 1 0 3 17.5a2.62 2.62 0 0 1-.708 1.792A1 1 0 0 0 3 21z"/><path d="M9.969 17.031l1.762-3.109a2 2 0 0 1 .434-.554L20.25 5.75a1.768 1.768 0 1 1 2.5 2.5l-7.618 8.085a2 2 0 0 1-.554.434l-3.109 1.762"/></svg> Brush</button>
      </div>
      <!-- brush-only: live radius readout + paint/erase toggle. Shown by the
           tool broker in main.js, same pattern as #pen-commit. -->
      <div id="brush-bar" class="seg" hidden>
        <button id="brush-erase" title="Painting — click or press E to erase"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12 21"/><path d="m5.082 11.09 8.828 8.828"/></svg> Erase</button>
        <span id="brush-size" title="Brush radius — [ and ] resize">5.0 mm</span>
      </div>
      <!-- pen-only: add/subtract mode. Subtract commits the shape as a bite
           out of the target layer (converting pen/brush layers to a shape
           layer). Shown by the tool broker in main.js, like #brush-bar. -->
      <div id="pen-bar" class="seg" hidden>
        <button id="pen-subtract" title="Adding — click or press E to subtract this shape out of the target layer">Subtract</button>
      </div>
      <!-- pen-only: commits the in-progress path without reaching for Enter.
           Shown by the tool broker in main.js, disabled until there is
           something pending (pen.js dispatches pen-pending-change). -->
      <button id="pen-commit" hidden disabled
              title="Finish the path you're drawing, as an open line (same as Enter). To close it into a shape instead, click back on the first anchor."><svg class="tool-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Commit</button>
      <select id="brush-select" hidden title="Brush — applies to the active drawing layer"></select>
    </div>
    <div id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- shown while the canvas holds a transient sheet/staged doc, not the
           live project (see actions.showDocPreview) -->
      <div id="doc-preview-banner" hidden>
        <span>previewing: <span id="doc-preview-label"></span></span>
        <button id="doc-preview-exit" title="back to the live project">✕ back to project</button>
      </div>
    </div>
    <!-- Playback transport: it belongs under the drawing it replays, not in
         the tool row. Hidden whenever the plan has no moves — an unusable
         ▶ is worse than an absent one, and `startAnimation` guards on exactly
         the same condition (canvas.js), so the strip cannot offer a play the
         canvas would refuse. main.js's updatePlayback() owns the toggle. -->
    <div id="playback" hidden>
      <button id="btn-animate" title="Replay the planned job at speed">▶ Animate plot</button>
      <label>speed ×<input type="number" id="anim-speed" value="20" min="1" max="500" step="1"></label>
    </div>
    <!-- The status line is the one strip that is always on screen and does
         not care which tab you are in, so machine truth lives here rather
         than in a panel you have to go and find. Costs no vertical space: the
         line already existed holding "nothing selected".

         Pause / Resume / Stop MOVED here bodily from the Plot panel (same
         ids, plot.js still binds them): they are the controls you want while
         watching the sheet, and needing the Plot tab open to stop a running
         machine was the wrong place for them. Plot itself stays in the Plot
         tab — starting a job is a deliberate act, stopping one is not. -->
    <div id="canvas-status">
      <span id="sel-readout">nothing selected</span>
      <span id="plan-warnings" class="warn"></span>
      <div id="machine-state" hidden>
        <span id="job-progress" class="readout"></span>
        <span id="job-remaining" class="readout"></span>
        <span id="pos-xy" class="readout" title="carriage position, machine frame">X — Y —</span>
        <span id="pen-state" title="pen up or down">pen —</span>
        <button id="btn-pause">Pause</button>
        <button id="btn-resume">Resume</button>
        <button id="btn-stop" class="danger" title="Stop the job, then return the carriage to home (0,0)">Stop ⌂</button>
      </div>
      <span id="global-error"></span>
    </div>
  </section>

  <!-- tabbed inspector -->
  <section id="inspector">
    <div id="sidebar-resize" title="drag to resize"></div>
    <nav id="tabs">
      <button data-tab="compose" class="on">Compose</button>
      <button data-tab="plot">Plot</button>
      <button data-tab="pens">Pens</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <div id="tab-compose" class="tab-body"></div>
    <div id="tab-plot" class="tab-body" hidden></div>
    <div id="tab-pens" class="tab-body" hidden></div>
    <div id="tab-settings" class="tab-body" hidden></div>

    <!-- The layer list, outside the tab bodies on purpose: it is the
         document's table of contents, and you need it whichever tab you are
         in — the Plot tab's target picker and the Pens tab's assignment both
         name layers you would otherwise have to leave the tab to see. It also
         stops selecting a layer costing a scroll past Generate and Import,
         which is what Ian asked for.

         It lives in index.html rather than being appended by compose.js
         because a tab body is rebuilt by innerHTML on every project load;
         static markup is never rebuilt, so no init ordering can lose it.
         Its SETTINGS stay in Compose — this is the selection box only. -->
    <section id="layers-dock">
      <div id="layers-dock-resize" title="drag to resize"></div>
      <h2 id="layers-dock-title">Layers</h2>
      <div id="layers-dock-body">
        <div class="hint">Top of the list draws last and occludes what's below.</div>
        <div id="layer-list"></div>
      </div>
    </section>
  </section>
</main>

<script type="module" src="/js/main.js"></script>
</body>
</html>
