<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>axibridge</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>axi<span>bridge</span></h1>
  <nav class="menubar" id="menubar">
    <div class="menu" data-menu="file">
      <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">File</button>
      <div class="menu-panel" role="menu">
        <button id="btn-save" class="menu-item" title="Save project folder">Save</button>
        <a id="btn-svg" class="menu-item" href="/api/doc/all/svg" download title="Download the resolved geometry (what the pen draws) as SVG">Download SVG</a>
      </div>
    </div>
    <div class="menu" data-menu="view">
      <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">View</button>
      <div class="menu-panel" role="menu">
        <button class="menu-item" type="button" data-view-proxy="portrait" title="Display rotation only — geometry never changes"><span class="menu-check">✓</span>Portrait</button>
        <button class="menu-item" type="button" data-view-proxy="landscape" title="Display rotation only — geometry never changes"><span class="menu-check">✓</span>Landscape</button>
      </div>
    </div>
  </nav>
  <input id="project-name" class="project-name" value="untitled" spellcheck="false">
  <div id="status-pill" class="pill">connecting…</div>
  <div id="estimate" class="estimate"></div>
</header>

<main>
  <!-- persistent centre canvas -->
  <section id="canvas-area">
    <div id="canvas-toolbar">
      <div class="seg" id="view-toggle">
        <button data-view="portrait" class="on" title="Display rotation only — geometry never changes">Portrait</button>
        <button data-view="landscape">Landscape</button>
      </div>
      <div class="seg" id="mode-toggle">
        <button data-mode="schematic" class="on">Schematic</button>
        <button data-mode="ink" title="True stroke widths and transparency">Ink</button>
      </div>
      <button id="zoom-fit" title="Fit page">⛶</button>
      <label><input type="checkbox" id="show-travel"> travel</label>
      <label><input type="checkbox" id="show-order"> draw order</label>
      <label><input type="checkbox" id="show-guide" checked> paper guide</label>
      <button id="btn-animate" title="Replay the planned job at speed">▶ Animate</button>
      <label>×<input type="number" id="anim-speed" value="20" min="1" max="500" step="1"></label>
      <div class="seg" id="ab-capture" title="Capture the current output as A, change anything, capture B, then ⇄ generates a staged series interpolating A → B (find it under Plot › Staging)">
        <button id="cap-a">A</button>
        <button id="cap-b">B</button>
        <input type="number" id="ab-steps" value="5" min="2" max="60" step="1" title="interpolation steps">
        <button id="ab-series" disabled>⇄ series</button>
      </div>
      <div class="seg" id="tool-toggle">
        <button data-tool="select" class="on" title="Select and transform layers"><svg class="tool-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3 L4 19 L8 15.5 L11 21 L13.5 19.8 L10.5 14 L17 14 Z"/></svg> Select</button>
        <button data-tool="draw" title="Draw on the sheet — strokes become a Drawing layer"><svg class="tool-icon" viewBox="0 0 24 24"><line x1="4" y1="20" x2="14" y2="10" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><path d="M14 10 L20 4 L17 1 L11 7 Z" fill="currentColor"/></svg> Draw</button>
        <button data-tool="pen" title="Anchor/handle pen — click for a corner, drag for a smooth curve"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M6 22 L2 22 L2 18 L15 5 L19 9 Z" fill="currentColor"/><rect x="15.5" y="1.5" width="5.5" height="5.5" fill="currentColor"/></svg> Pen</button>
      </div>
      <select id="brush-select" hidden title="Brush — applies to the active drawing layer"></select>
    </div>
    <div id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- shown while the canvas holds a transient sheet/staged doc, not the
           live project (see actions.showDocPreview) -->
      <div id="doc-preview-banner" hidden>
        <span>previewing: <span id="doc-preview-label"></span></span>
        <button id="doc-preview-exit" title="back to the live project">✕ back to project</button>
      </div>
    </div>
    <div id="canvas-status">
      <span id="sel-readout">nothing selected</span>
      <span id="plan-warnings" class="warn"></span>
      <span id="global-error"></span>
    </div>
  </section>

  <!-- tabbed inspector -->
  <section id="inspector">
    <div id="sidebar-resize" title="drag to resize"></div>
    <nav id="tabs">
      <button data-tab="compose" class="on">Compose</button>
      <button data-tab="plot">Plot</button>
      <button data-tab="pens">Pens</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <div id="tab-compose" class="tab-body"></div>
    <div id="tab-plot" class="tab-body" hidden></div>
    <div id="tab-pens" class="tab-body" hidden></div>
    <div id="tab-settings" class="tab-body" hidden></div>
  </section>
</main>

<script type="module" src="/js/main.js"></script>
</body>
</html>
