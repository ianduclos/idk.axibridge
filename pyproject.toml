[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axibridge"
version = "0.2.0"
description = "Layer-compositing experimental control surface for the AxiDraw V3 pen plotter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pyserial>=3.5",
    "vpype>=1.14",
    # imported directly (not just via vpype): occlusion engine + SVG reader
    "shapely>=2.0",
    "svgelements>=1.9",
    # depth-map displacement effect: PNG decoding
    "pillow>=10",
    # frame-sequence import: decode a video into evenly spaced frames
    # (imageio-ffmpeg bundles a static ffmpeg — no system install needed)
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
# The official AxiDraw API is NOT on PyPI; install it with:
#   pip install https://cdn.evilmadscientist.com/dl/ad/public/AxiDraw_API.zip
# The native backend reports itself unavailable until pyaxidraw is importable.
occult = ["vpype-occult>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
axibridge = "axibridge.__main__:main"

[tool.setuptools.packages.find]
include = ["axibridge*"]

[tool.setuptools.package-data]
axibridge = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
