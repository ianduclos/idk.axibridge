[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axibridge"
version = "0.2.0"
description = "Layer-compositing experimental control surface for the AxiDraw V3 pen plotter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pyserial>=3.5",
    "vpype>=1.14",
    # fast-marching topo source: compiled marching-squares contour extraction
    "contourpy>=1.2",
    # imported directly (not just via vpype): occlusion engine + SVG reader
    "shapely>=2.0",
    "svgelements>=1.9",
    # depth-map displacement effect: PNG decoding
    "pillow>=10",
    # glyph outline extraction: stick-font stroke text and filled-outline text
    # both parse TTF/OTF contours through this. Was previously only a
    # transitive dep (pulled in by matplotlib) -- pinned directly since the
    # text sources import it themselves.
    "fonttools>=4.53",
    # frame-sequence import: decode a video into evenly spaced frames
    # (imageio-ffmpeg bundles a static ffmpeg — no system install needed)
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
    # app shell (launch/axibridge_app.py): native window, no Terminal
    "pywebview>=5",
]

[project.optional-dependencies]
# The official AxiDraw API is NOT on PyPI; install it with:
#   pip install https://cdn.evilmadscientist.com/dl/ad/public/AxiDraw_API.zip
# The native backend reports itself unavailable until pyaxidraw is importable.
occult = ["vpype-occult>=0.4"]
# playwright drives the acceptance harness (tests/test_acceptance_ui.py).
# The browser itself is a separate, once-per-machine step:
#   .venv/bin/python -m playwright install chromium
# Without either, that module skips — the Pi stays backend-only.
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44"]
# Optional compiled accelerator for the Fast Marching Topo solve
# (axibridge/sources/_fast_marching.py). The pure-Python heap solver is
# always available and is the tested reference — this is a speed-only
# upgrade, never required. Deliberately excluded from the Pi's normal
# install so a machine with no compiler toolchain still works unaided.
fast = ["scikit-fmm>=2024"]
# Optional exact nonzero-winding overlap resolver for filled-outline text
# (axibridge/sources/_fontglyph.py) — the same library fontTools' own
# removeOverlaps uses. A pure shapely winding+containment fallback is always
# available and is the tested reference for well-formed (non-self-
# overlapping) glyphs; skia-pathops only matters for fonts authored with
# deliberately overlapping contours. Deliberately excluded from the Pi's
# normal install, same rationale as `fast`.
text = ["skia-pathops>=0.8"]

[project.scripts]
axibridge = "axibridge.__main__:main"

[tool.setuptools.packages.find]
include = ["axibridge*"]

[tool.setuptools.package-data]
axibridge = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
